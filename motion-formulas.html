<script>
const sub = (a,b)=>b?`${a}<sub>${b}</sub>`:a;
const fmt = n => {
  if(!isFinite(n)) return "—";
  const r = Math.round(n*10000)/10000;
  return r.toLocaleString("en-US",{maximumFractionDigits:4});
};
const PI = Math.PI;
const FH = (()=>{
  const V=(a,b)=>`<i>${a}${b?`<sub>${b}</sub>`:""}</i>`;
  const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
  const X='<span class="op">×</span>', EQ='<span class="op">=</span>', MN='<span class="op">−</span>';
  const M=(...a)=>a.join(X);
  const slip=`(1${MN}${fr(V("S"),"100")})`;
  const N1=V("N",1),N2=V("N",2),D1=V("D",1),D2=V("D",2),T1=V("T",1),T2=V("T",2),t1=V("τ",1),t2=V("τ",2),W=V("ω"),N=V("N"),TT=V("τ"),GR=V("GR"),P=V("P");
  const n=V("n"),mu=V("μ"),Wf=V("W"),R=V("R");
  const gearish={
    N2:N2+EQ+M(N1,fr(T1,T2)), N1:N1+EQ+M(N2,fr(T2,T1)),
    T1:T1+EQ+fr(M(N2,T2),N1), T2:T2+EQ+fr(M(N1,T1),N2)};
  return {
    s1:{eq:W+EQ+fr(M("2","π",N),"60"), w:W+EQ+fr(M("2","π",N),"60"), N:N+EQ+fr(M("60",W),M("2","π"))},
    s2:{eq:fr(N2,N1)+EQ+fr(D1,D2)+'<span class="op"> ; ලිස්සා යාම සමග: </span>'+N2+EQ+M(N1,fr(D1,D2),slip),
        N2:N2+EQ+M(N1,fr(D1,D2),slip), N1:N1+EQ+fr(M(N2,D2),M(D1,slip)),
        D1:D1+EQ+fr(M(N2,D2),M(N1,slip)), D2:D2+EQ+fr(M(N1,D1,slip),N2),
        S:V("S")+EQ+`(1${MN}`+fr(M(N2,D2),M(N1,D1))+`)${X}100`},
    s3:{eq:fr(N2,N1)+EQ+fr(T1,T2), ...gearish},
    s4:{eq:GR+EQ+fr(N1,N2)+EQ+fr(T2,T1), ...gearish},
    s4b:{eq:GR+EQ+fr(t2,t1), GR:GR+EQ+fr(t2,t1), t1:t1+EQ+fr(t2,GR), t2:t2+EQ+M(GR,t1)},
    s5:{eq:TT+EQ+M(n,mu,Wf,R), t:TT+EQ+M(n,mu,Wf,R), W:Wf+EQ+fr(TT,M(n,mu,R)),
        mu:mu+EQ+fr(TT,M(n,Wf,R)), R:R+EQ+fr(TT,M(n,mu,Wf)), n:n+EQ+fr(TT,M(mu,Wf,R))},
    s6:{eq:P+EQ+fr(M("2","π",N,TT),"60"), P:P+EQ+fr(M("2","π",N,TT),"60"),
        t:TT+EQ+fr(M("60",P),M("2","π",N)), N:N+EQ+fr(M("60",P),M("2","π",TT))}
  };
})();

/* Each section: vars with label(html), name (Sinhala), unit; solve[key](v) returns value; formula(key) shows the rearranged formula */
const SECTIONS = [
{
  id:"s1", title:"1. කෝණික වේගය (ω) සහ භ්‍රමණ වේගය (N)",
  eq:"ω = 2πN / 60",
  keys:"කෝණික වේගය භ්‍රමණ වේගය omega rpm rad/s",
  vars:[
    {k:"w",l:"ω",n:"කෝණික වේගය",u:"rad/s"},
    {k:"N",l:"N",n:"භ්‍රමණ වේගය",u:"RPM"}],
  solve:{
    w:{f:"ω = 2πN / 60", c:v=>2*PI*v.N/60},
    N:{f:"N = 60ω / 2π", c:v=>60*v.w/(2*PI)}},
  note:["π ≈ 3.1416"]
},
{
  id:"s2", title:"2. පටි සහ කප්පි පද්ධති (Belt and Pulley)",
  eq:"N<sub>2</sub> / N<sub>1</sub> = D<sub>1</sub> / D<sub>2</sub> &nbsp;<small>(ලිස්සා යාම සමග: ×(1 − S/100))</small>",
  keys:"පටි කප්පි belt pulley වේග අනුපාතය ලිස්සා යාම slip විෂ්කම්භය",
  vars:[
    {k:"N1",l:sub("N",1),n:"ධාවක කප්පියේ වේගය",u:"RPM"},
    {k:"N2",l:sub("N",2),n:"අනුගාමික කප්පියේ වේගය",u:"RPM"},
    {k:"D1",l:sub("D",1),n:"ධාවක කප්පියේ විෂ්කම්භය",u:"mm / m"},
    {k:"D2",l:sub("D",2),n:"අනුගාමික කප්පියේ විෂ්කම්භය",u:"mm / m"},
    {k:"S",l:"S",n:"ලිස්සා යාම් ප්‍රතිශතය",u:"%",def:0}],
  solve:{
    N2:{f:"N₂ = N₁ × (D₁ / D₂) × (1 − S/100)", c:v=>v.N1*v.D1/v.D2*(1-v.S/100)},
    N1:{f:"N₁ = N₂ × D₂ / [D₁ × (1 − S/100)]", c:v=>v.N2*v.D2/(v.D1*(1-v.S/100))},
    D1:{f:"D₁ = N₂ × D₂ / [N₁ × (1 − S/100)]", c:v=>v.N2*v.D2/(v.N1*(1-v.S/100))},
    D2:{f:"D₂ = N₁ × D₁ × (1 − S/100) / N₂", c:v=>v.N1*v.D1*(1-v.S/100)/v.N2},
    S:{f:"S = [1 − (N₂ × D₂) / (N₁ × D₁)] × 100", c:v=>(1-(v.N2*v.D2)/(v.N1*v.D1))*100}},
  note:["ලිස්සා යාමක් නැත්නම් S = 0 ලෙස තබන්න.","D₁, D₂ දෙකම එකම ඒකකයෙන් (mm හෝ m) ඇතුළත් කරන්න."]
},
{
  id:"s3", title:"3. දම්වැල් සහ ස්ප්‍රොකට් පද්ධති (Chain and Sprocket)",
  eq:"N<sub>2</sub> / N<sub>1</sub> = T<sub>1</sub> / T<sub>2</sub> &nbsp;<small>(N₁T₁ = N₂T₂)</small>",
  keys:"දම්වැල් ස්ප්‍රොකට් chain sprocket දත් ගණන",
  vars:[
    {k:"N1",l:sub("N",1),n:"ධාවක ස්ප්‍රොකට් වේගය",u:"RPM"},
    {k:"N2",l:sub("N",2),n:"අනුගාමික ස්ප්‍රොකට් වේගය",u:"RPM"},
    {k:"T1",l:sub("T",1),n:"ධාවක ස්ප්‍රොකට් දත් ගණන",u:"දත්"},
    {k:"T2",l:sub("T",2),n:"අනුගාමික ස්ප්‍රොකට් දත් ගණන",u:"දත්"}],
  solve:{
    N2:{f:"N₂ = N₁ × T₁ / T₂", c:v=>v.N1*v.T1/v.T2},
    N1:{f:"N₁ = N₂ × T₂ / T₁", c:v=>v.N2*v.T2/v.T1},
    T1:{f:"T₁ = N₂ × T₂ / N₁", c:v=>v.N2*v.T2/v.N1},
    T2:{f:"T₂ = N₁ × T₁ / N₂", c:v=>v.N1*v.T1/v.N2}},
  note:[]
},
{
  id:"s4", title:"4. ගියර් පද්ධති (Gear Systems) – වේගය සහ දත් ගණන",
  eq:"GR = N<sub>1</sub> / N<sub>2</sub> = T<sub>2</sub> / T<sub>1</sub>",
  keys:"ගියර් gear ගියර් අනුපාතය gear ratio දත් ගණන",
  vars:[
    {k:"N1",l:sub("N",1),n:"ආදාන (ධාවක) වේගය",u:"RPM"},
    {k:"N2",l:sub("N",2),n:"ප්‍රතිදාන (අනුගාමික) වේගය",u:"RPM"},
    {k:"T1",l:sub("T",1),n:"ධාවක ගියරයේ දත් ගණන",u:"දත්"},
    {k:"T2",l:sub("T",2),n:"අනුගාමික ගියරයේ දත් ගණන",u:"දත්"}],
  solve:{
    N2:{f:"N₂ = N₁ × T₁ / T₂", c:v=>v.N1*v.T1/v.T2},
    N1:{f:"N₁ = N₂ × T₂ / T₁", c:v=>v.N2*v.T2/v.T1},
    T2:{f:"T₂ = N₁ × T₁ / N₂", c:v=>v.N1*v.T1/v.N2},
    T1:{f:"T₁ = N₂ × T₂ / N₁", c:v=>v.N2*v.T2/v.N1}},
  extra:v=>`ගියර් අනුපාතය GR = T₂ / T₁ = ${fmt(v.T2/v.T1)}`,
  note:[]
},
{
  id:"s4b", title:"4(ආ). ගියර් අනුපාතය සහ ව්‍යාවර්ථය",
  eq:"GR = τ<sub>2</sub> / τ<sub>1</sub>",
  keys:"ගියර් අනුපාතය ව්‍යාවර්ථය torque tau gear ratio",
  vars:[
    {k:"GR",l:"GR",n:"ගියර් අනුපාතය",u:""},
    {k:"t1",l:"τ<sub>1</sub>",n:"ආදාන ව්‍යාවර්ථය",u:"N m"},
    {k:"t2",l:"τ<sub>2</sub>",n:"ප්‍රතිදාන ව්‍යාවර්ථය",u:"N m"}],
  solve:{
    GR:{f:"GR = τ₂ / τ₁", c:v=>v.t2/v.t1},
    t1:{f:"τ₁ = τ₂ / GR", c:v=>v.t2/v.GR},
    t2:{f:"τ₂ = GR × τ₁", c:v=>v.GR*v.t1}},
  note:[]
},
{
  id:"s5", title:"5. ක්ලච් පද්ධති (Clutch Systems)",
  eq:"τ = n μ W R",
  keys:"ක්ලච් clutch ව්‍යාවර්ථය ඝර්ෂණ සංගුණකය අක්ෂීය බලය මධ්‍යන්‍ය අරය ඝර්ෂණ පෘෂ්ඨ",
  vars:[
    {k:"t",l:"τ",n:"සම්ප්‍රේෂණය වන ව්‍යාවර්ථය",u:"N m"},
    {k:"n",l:"n",n:"ඝර්ෂණ පෘෂ්ඨ ගණන",u:""},
    {k:"mu",l:"μ",n:"ඝර්ෂණ සංගුණකය",u:""},
    {k:"W",l:"W",n:"අක්ෂීය තද කිරීමේ බලය",u:"N"},
    {k:"R",l:"R",n:"මධ්‍යන්‍ය අරය",u:"m"}],
  solve:{
    t:{f:"τ = n × μ × W × R", c:v=>v.n*v.mu*v.W*v.R},
    W:{f:"W = τ / (n × μ × R)", c:v=>v.t/(v.n*v.mu*v.R)},
    mu:{f:"μ = τ / (n × W × R)", c:v=>v.t/(v.n*v.W*v.R)},
    R:{f:"R = τ / (n × μ × W)", c:v=>v.t/(v.n*v.mu*v.W)},
    n:{f:"n = τ / (μ × W × R)", c:v=>v.t/(v.mu*v.W*v.R)}},
  note:["අරය R මීටර (m) වලින් ඇතුළත් කරන්න (mm ÷ 1000)."]
},
{
  id:"s6", title:"6. ෂාෆ්ට් මඟින් බලය සම්ප්‍රේෂණය (Power Shafts)",
  eq:"P = 2πNτ / 60",
  keys:"ෂාෆ්ට් shaft බලය power watt ව්‍යාවර්ථය",
  vars:[
    {k:"P",l:"P",n:"බලය",u:"W"},
    {k:"N",l:"N",n:"ෂාෆ්ට් එකේ භ්‍රමණ වේගය",u:"RPM"},
    {k:"t",l:"τ",n:"සම්ප්‍රේෂණය වන ව්‍යාවර්ථය",u:"N m"}],
  solve:{
    P:{f:"P = 2πNτ / 60", c:v=>2*PI*v.N*v.t/60},
    t:{f:"τ = 60P / 2πN", c:v=>60*v.P/(2*PI*v.N)},
    N:{f:"N = 60P / 2πτ", c:v=>60*v.P/(2*PI*v.t)}},
  note:["π ≈ 3.1416"]
}
];

const list = document.getElementById("list");
const toc = document.getElementById("toc");

function build(sec){
  const el = document.createElement("section");
  el.className="card"; el.id=sec.id;
  const first = sec.vars[0].k;
  el.innerHTML = `
    <h2>${sec.title}</h2>
    <div class="body">
      <div class="eq math">${FH[sec.id].eq}</div>
      <div class="label">සෙවිය යුතු අකුර තෝරන්න</div>
      <div class="chips" role="radiogroup">
        ${sec.vars.map((x,i)=>`<label class="chip"><input type="radio" name="${sec.id}-r" value="${x.k}" ${i===0?"checked":""}><span>${x.l}</span></label>`).join("")}
      </div>
      <div class="find"></div>
      <div class="fields"></div>
      <div class="out" aria-live="polite"></div>
      <ul class="sym">${sec.vars.map(x=>`<li>${x.l} = ${x.n}${x.u?` (${x.u})`:""}</li>`).join("")}${sec.note.map(t=>`<li>• ${t}</li>`).join("")}</ul>
    </div>`;
  const fields = el.querySelector(".fields"), out = el.querySelector(".out"), find = el.querySelector(".find");
  const vals = {}; sec.vars.forEach(x=>{ if(x.def!==undefined) vals[x.k]=String(x.def); });

  function render(){
    const target = el.querySelector("input[type=radio]:checked").value;
    const tv = sec.vars.find(x=>x.k===target);
    find.innerHTML = `${tv.l} සෙවීමට – ${tv.n}`;
    fields.innerHTML = sec.vars.filter(x=>x.k!==target).map(x=>
      `<label>${x.l} – ${x.n}${x.u?` (${x.u})`:""}<input type="number" step="any" inputmode="decimal" data-k="${x.k}" value="${vals[x.k]??""}"></label>`).join("");
    fields.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{vals[i.dataset.k]=i.value;calc();}));
    calc();
  }
  function calc(){
    const target = el.querySelector("input[type=radio]:checked").value;
    const tv = sec.vars.find(x=>x.k===target), s = sec.solve[target];
    const v = {};
    let missing = false;
    sec.vars.forEach(x=>{
      if(x.k===target) return;
      const raw = vals[x.k];
      if(raw===undefined||raw===""){ missing=true; return; }
      v[x.k]=parseFloat(raw);
    });
    out.className="out";
    if(missing){
      out.innerHTML = `<div class="f math">${FH[sec.id][target]}</div><div class="f">අනෙක් සියලු අගයන් ඇතුළත් කරන්න.</div>`; return;
    }
    const r = s.c(v);
    if(!isFinite(r)){
      out.className="out err";
      out.innerHTML = `<div class="v">ගණනය කළ නොහැක – බිංදුවෙන් බෙදීමක් සිදු වේ. අගයන් පරීක්ෂා කරන්න.</div>`; return;
    }
    out.innerHTML = `<div class="v">${tv.l} = ${fmt(r)} ${tv.u}</div><div class="f math">${FH[sec.id][target]}</div>${sec.extra?`<div class="f">${sec.extra({...v,[target]:r})}</div>`:""}`;
  }
  el.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",render));
  render();
  return el;
}

SECTIONS.forEach(sec=>{
  list.appendChild(build(sec));
  const a=document.createElement("a"); a.href="#"+sec.id; a.textContent=sec.title.split(" (")[0].split(" – ")[0]; toc.appendChild(a);
});

const q = document.getElementById("q");
q.addEventListener("input",()=>{
  const t = q.value.trim().toLowerCase().replace(/[₁₂]/g,c=>c==="₁"?"1":"2");
  let shown=0;
  SECTIONS.forEach(sec=>{
    const hay = (sec.title+" "+sec.keys+" "+sec.vars.map(x=>x.l.replace(/<[^>]+>/g,"")+" "+x.n).join(" ")+" "+sec.vars.map(x=>x.k).join(" ")).toLowerCase();
    const hit = !t || hay.includes(t) || hay.replace(/<[^>]+>/g,"").includes(t);
    document.getElementById(sec.id).style.display = hit?"":"none"; if(hit) shown++;
  });
  let e=document.getElementById("empty");
  if(!shown){ if(!e){e=document.createElement("div");e.id="empty";e.className="empty";e.textContent="ගැළපෙන සූත්‍රයක් නැත. වෙනත් වචනයකින් සොයන්න.";list.appendChild(e);} }
  else if(e) e.remove();
});
</script>
</body>
</html>
